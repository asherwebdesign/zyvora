<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080604"><title>My Account | ZYVORA</title><link rel="stylesheet" href="/styles.css"><style>
:root{color-scheme:dark}body{margin:0;background:#080706;color:#f4eee4;font-family:Manrope,Arial,sans-serif}.account-wrap{max-width:1120px;margin:auto;padding:28px 20px 70px}.account-top{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:12px 0 22px;border-bottom:1px solid #c6a15b55}.account-brand{font-size:27px;font-weight:900;letter-spacing:.18em;color:#f4eee4;text-decoration:none}.account-brand span{color:#d5ad68}.account-top a,.account-top button{color:#e4c88f}.account-top button,.account-card button{background:#17130e;border:1px solid #c6a15b77;border-radius:7px;padding:11px 15px;cursor:pointer}.account-hero{padding:38px 0 26px}.eyebrow{color:#d3ad6b;letter-spacing:.2em;font-size:11px}.account-hero h1{font-family:Georgia,serif;font-size:clamp(34px,6vw,58px);font-weight:400;margin:8px 0}.account-hero p,.muted{color:#b9ad9d}.account-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15px}.account-card{background:linear-gradient(145deg,#17130f,#0d0c0a);border:1px solid #c6a15b40;border-radius:12px;padding:20px;min-width:0}.profile-card{grid-column:span 5}.orders-card{grid-column:span 7}.wishlist-card{grid-column:span 12}.account-card h2{font:26px Georgia,serif;margin:0 0 17px}.profile-form{display:grid;gap:12px}.profile-form label{display:grid;gap:6px;color:#c9bdac;font-size:13px}.profile-form input{background:#090807;color:#fff;border:1px solid #c6a15b55;border-radius:6px;padding:12px;min-width:0}.gold-btn{background:#c6a15b!important;color:#100b05!important;font-weight:800}.record{padding:13px 0;border-top:1px solid #c6a15b30;display:flex;justify-content:space-between;gap:12px;align-items:center}.record strong{display:block}.status{color:#e4c88f;text-transform:capitalize}.wishlist-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.wish-item{border:1px solid #c6a15b30;border-radius:9px;padding:12px}.wish-item img{width:100%;height:130px;object-fit:cover;border-radius:6px}.notice{padding:12px;background:#1d180f;border-radius:7px;color:#e9d5ae;margin:12px 0}.empty{color:#a99d8d;padding:18px 0}.account-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.account-links a{color:#e4c88f}@media(max-width:760px){.profile-card,.orders-card{grid-column:span 12}.account-wrap{padding:18px 14px 50px}.account-top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="account-wrap"><header class="account-top"><a class="account-brand" href="/">ZYVORA<span>✦</span></a><div><a href="/">← Back to the realms</a>　<button id="signout" type="button">Sign out</button></div></header><section class="account-hero"><span class="eyebrow">YOUR PRIVATE REALM</span><h1>Welcome back<span style="color:#d5ad68">.</span></h1><p>Manage your details, keep an eye on your orders and revisit the pieces you saved.</p></section><div id="notice" class="notice" role="status">Loading your account…</div><section class="account-grid"><article class="account-card profile-card"><h2>Your details</h2><form id="profileForm" class="profile-form"><label>Full name<input name="name" minlength="2" maxlength="100" required></label><label>Email address<input name="email" type="email" readonly></label><label>Phone number<input name="phone" maxlength="40" inputmode="tel"></label><button class="gold-btn" type="submit">Save details</button></form><div class="account-links"><a href="/settings.html">Country · Currency · Language ⚙</a></div></article><article class="account-card orders-card"><h2>Your orders</h2><div id="orders"><p class="empty">Loading orders…</p></div></article><article class="account-card wishlist-card"><h2>Your saved finds</h2><div id="wishlist" class="wishlist-list"><p class="empty">Loading wishlist…</p></div></article></section></main><script src="/account.js"></script></body></html>
