<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZYVORA Marketplace Centre</title><link rel="stylesheet" href="/styles.css"><style>
:root{color-scheme:dark}body{background:#070707;color:#eee8dc;font:15px/1.5 Manrope,Arial,sans-serif;margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #c6a15b40;padding-bottom:20px}.brand{font-size:28px;letter-spacing:.16em;font-weight:900}.brand span{color:#e4c88f}.muted{color:#a49a8d}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.tabs button,.btn{background:#111010;color:#eee8dc;border:1px solid #c6a15b55;padding:11px 15px;border-radius:8px;cursor:pointer}.tabs button.active,.btn.primary{background:#c6a15b;color:#100b05;border-color:#c6a15b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#111010;border:1px solid #c6a15b35;border-radius:12px;padding:18px;min-width:0}.card h3{margin-top:0}.metric{font-size:28px;font-weight:800}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.form label{display:grid;gap:6px;color:#c8bba8}.form input,.form textarea,.form select{background:#080807;color:#eee8dc;border:1px solid #c6a15b55;border-radius:7px;padding:12px;min-width:0}.form textarea{min-height:90px}.wide{grid-column:1/-1}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table td,.table th{text-align:left;padding:11px;border-bottom:1px solid #c6a15b35}.notice{padding:12px;background:#1b160e;border-radius:8px;margin:12px 0}.danger{color:#ff9d9d}.hidden{display:none}a{color:#e4c88f}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.wrap{padding:18px 12px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">ZYVORA<span>✦</span></div><div class="muted">Marketplace operations centre</div></div><div><a href="/">← Storefront</a>　<button class="btn" id="signout">Sign out</button></div></header><div id="notice" class="notice">Loading your secure workspace…</div><nav class="tabs" id="tabs"></nav><section id="view"></section></main><script src="/marketplace.js"></script></body></html>
